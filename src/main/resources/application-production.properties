# =============================================================================
# application-production.properties — PRODUCAO (Render Free)
#
# Ativado pelo Render via Environment Variable:
#   SPRING_PROFILES_ACTIVE = production
#
# As credenciais do banco NAO ficam aqui.
# Elas sao injetadas pelo Render via Environment Variables:
#   DB_URL      = jdbc:sqlserver://...
#   DB_USERNAME = jao-prado_SQLLogin_1
#   DB_PASSWORD = j3x7bu3tt8
# =============================================================================

# --- JPA / Hibernate ---
# none: nao valida nem altera o schema no startup.
# Elimina as queries DDL que o Hibernate faz contra o Somee ao iniciar,
# que eram a principal causa de lentidao no cold start.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# --- HikariCP producao ---
# Render Free tem ~512MB de RAM. Pool de 2 e suficiente e economiza memoria.
spring.datasource.hikari.maximum-pool-size=2

# --- Logs silenciosos ---
# Reduz drasticamente o volume de output no stdout do Render.
# Logs excessivos consomem I/O e podem atrasar respostas em containers lentos.
logging.level.root=WARN
logging.level.com.itb.inf3em.studyconnect=INFO
logging.level.org.hibernate=WARN
logging.level.org.springframework.web=WARN
logging.level.com.zaxxer.hikari=INFO

# --- Erros em producao ---
# Nao expoe mensagens de erro internas para o cliente.
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
