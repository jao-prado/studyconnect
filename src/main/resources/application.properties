# =============================================================================
# application.properties — BASE (carregado em TODOS os ambientes)
#
# Regra: aqui ficam APENAS configs universais e seguras.
# Nada de credenciais, nada de ddl-auto, nada de nivel de log especifico.
# Cada ambiente sobrescreve o que precisa no seu proprio arquivo de profile.
# =============================================================================

spring.application.name=studyconnect

# Porta: Render injeta PORT automaticamente; 8080 e o fallback local
server.port=${PORT:8080}

# =============================================================================
# Datasource — credenciais vem EXCLUSIVAMENTE de variaveis de ambiente.
#
# O Spring Boot le SPRING_DATASOURCE_URL / USERNAME / PASSWORD automaticamente
# sem precisar declarar aqui. Basta ter as env vars configuradas no Render.
# O driver e o unico valor fixo pois nao muda entre ambientes.
#
# Render env vars necessarias:
#   SPRING_DATASOURCE_URL      = jdbc:sqlserver://...
#   SPRING_DATASOURCE_USERNAME = jao-prado_SQLLogin_1
#   SPRING_DATASOURCE_PASSWORD = j3x7bu3tt8
#
# Para dev local, os valores ficam em application-local.properties.
# =============================================================================
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver

# =============================================================================
# HikariCP — pool de conexoes
# Valores base conservadores, validos para qualquer ambiente.
# application-production.properties pode sobrescrever se necessario.
# =============================================================================

# Tempo maximo para obter uma conexao do pool (15s antes de lancar erro)
spring.datasource.hikari.connection-timeout=15000

# Tempo maximo para validar se a conexao ainda esta viva
spring.datasource.hikari.validation-timeout=5000

# Conexao idle por mais de 5min e fechada e devolvida ao pool
spring.datasource.hikari.idle-timeout=300000

# Conexao vive no maximo 10min (evita conexoes zumbis com o Somee)
spring.datasource.hikari.max-lifetime=600000

# Ping periodico a cada 60s para manter a conexao viva no Somee
spring.datasource.hikari.keepalive-time=60000

# Pool de 1 a 3 conexoes: adequado para Render Free e para dev local
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=3

# Nao trava o startup se o banco estiver fora.
# O app sobe e tenta conectar apenas no primeiro request real.
spring.datasource.hikari.initialization-fail-timeout=-1

# =============================================================================
# JPA / Hibernate
# ddl-auto NAO e definido aqui: cada ambiente define o seu.
# local usa "update"; producao usa "none".
# =============================================================================

spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
# Desativa open-in-view: libera a conexao com o banco assim que a query
# termina, em vez de manter aberta ate o fim da serializacao JSON.
spring.jpa.open-in-view=false

spring.sql.init.mode=never

# =============================================================================
# Erros — sobrescrito em producao para nao expor detalhes internos
# =============================================================================
server.error.include-message=always
server.error.include-binding-errors=always

# =============================================================================
# E-mail / SMTP
# Valores lidos de variaveis de ambiente — configure no Render e localmente.
# Render env vars: APP_MAIL_HOST, APP_MAIL_PORT, APP_MAIL_USERNAME,
#                  APP_MAIL_PASSWORD, APP_MAIL_FROM, APP_MAIL_SSL
# =============================================================================

app.mail.host=${APP_MAIL_HOST:smtp.gmail.com}
app.mail.port=${APP_MAIL_PORT:587}
app.mail.username=${APP_MAIL_USERNAME:}
app.mail.password=${APP_MAIL_PASSWORD:}
app.mail.from=${APP_MAIL_FROM:}
app.mail.auth=${APP_MAIL_AUTH:true}
app.mail.starttls=${APP_MAIL_STARTTLS:false}
app.mail.ssl=${APP_MAIL_SSL:true}

# =============================================================================
# Frontend
# =============================================================================
app.frontend.url=${APP_FRONTEND_URL:http://localhost:5173}